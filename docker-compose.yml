services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hme_website}
      POSTGRES_USER: ${POSTGRES_USER:-hme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-hme}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hme_website}}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-false}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi di .env}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:?ADMIN_INVITE_CODE wajib diisi di .env}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3001}
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "${APP_PORT:-3001}:3001"

volumes:
  postgres_data:
